[project]
name = "readytrader-stocks"
version = "0.1.0"
description = "Local paper-only US common-stock MCP with atomic SQLite accounting."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
norecursedirs = ["legacy", ".venv", ".work"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 160
target-version = "py312"
extend-exclude = ["data/"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"defi/uniswap_v3.py" = ["E501"]


