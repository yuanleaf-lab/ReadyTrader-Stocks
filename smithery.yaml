startCommand:
  type: stdio
  command: python
  args:
    - app/main.py
name: ReadyTrader Paper Stocks
description: >-
  Local, Paper-only MCP for USD-denominated US common-stock simulation. It has
  no brokerage credentials, live execution, crypto, options, shorting, or leverage.
projectUrl: https://github.com/up2itnow/ReadyTrader-Stocks
configSchema:
  type: object
  properties:
    PAPER_DB_PATH:
      type: string
      description: Server-managed SQLite path for the persistent Paper ledger.
    PAPER_INITIAL_CASH:
      type: string
      description: Initial USD cash used only when the account database is first created.
    PAPER_APPROVED_SYMBOLS:
      type: string
      description: Server-managed comma-separated symbols for ambiguous common-stock metadata.
  required: []
